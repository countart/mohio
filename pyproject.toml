[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mohio"
version = "5.0.0"
readme = "README.md"
description = "Mohio, an AI-native language where AI reasoning and compliance are compiler-enforced primitives."
# The floor is what the suite is ACTUALLY exercised on, and that is 3.12: the development
# machine runs 3.12.6 and every full-suite run to date has been on it. ">=3.13" excluded the
# only interpreter the tests have ever passed on -- it named the deployment image (Dockerfile
# and Dockerfile.jproof build on python:3.13-slim, pioneer-digest.yml pins 3.13) and called
# that the floor, which had it backwards: those are the CEILING that is also tested, not the
# minimum that is required. The real minimum is 3.12, because the PEP-701 f-strings in this
# codebase need 3.12+. A 3.12 floor still admits every 3.13 image above it.
# Re-ruled 2026-09-02 (an earlier pass had applied 3.13 before this was checked).
requires-python = ">=3.12"
dependencies = ["lark>=1.1.0", "anthropic>=0.96.0", "cryptography>=49.0.0", "tiktoken>=0.13.0", "bcrypt>=4.0", "nh3>=0.2.0"]

[project.optional-dependencies]
# RH-2: bcrypt and nh3 moved to base dependencies above -- a bare `pip install mohio` needs both
# (a login program hashing a password, and any HTML the runtime sanitizes, work on install day
# one). auth/serve stay declared, now empty/lighter, so `pip install mohio[auth]` /
# `mohio[serve]` from an existing requirements file still resolves rather than erroring on an
# unknown extra.
serve = ["fastapi>=0.110.0", "uvicorn>=0.30.0", "starlette>=0.37.0", "python-multipart>=0.0.9"]
postgres = ["psycopg2-binary>=2.9.0"]
mongo = ["pymongo>=4.0.0"]
mysql = ["pymysql>=1.1.0"]
auth = []

[project.scripts]
mio = "mio:main"

[tool.setuptools]
py-modules = ["mio", "mio_utils", "mohio_ai", "mohio_ast", "mohio_audit_grades", "mohio_enforce", "mohio_fmt", "mohio_html_sanitize", "mohio_interpreter", "mohio_langmap", "mohio_layer3", "mohio_mioscript", "mohio_pretokenizer", "mohio_reachability", "mohio_schema", "mohio_sector_loader", "mohio_server", "mohio_services", "mohio_symbol_table", "mohio_test_grammar", "mohio_transformer", "mohio_transformer_ast", "mohio_version"]
packages = ["mohio_data"]
include-package-data = true

[tool.setuptools.package-data]
mohio_data = ["*.lark", "sectors/*.sector", "maps/*.langmap"]
